:root{

/* ---------- CIVICA chrome ---------- */
.skip-link{
  position:absolute; left:12px; top:-4rem; z-index:100;
  background:var(--civica-mark); color:var(--on-mark);
  font-family:var(--font-display); font-weight:700; font-size:15px;
  padding:11px 18px; border-radius:10px; text-decoration:none;
  transition:top .2s ease;
}
.skip-link:focus{ top:12px; }

.civica-bar{ border-bottom:1px solid var(--line); }
.civica-bar > div{
  max-width:800px; margin:0 auto; padding:14px 1.5rem;
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.civica-mark{ display:flex; flex-direction:column; gap:2px; text-decoration:none; line-height:1; }
/* PLACEHOLDER WORDMARK — the CIVICA logo is set in Movement (licensed, NM Type)
   and cannot be embedded. Swap the two spans for the official transparent SVG
   once one is available. */
.civica-wordmark{
  font-weight:900; font-size:18px; letter-spacing:.06em; color:var(--civica-mark);
}
.civica-sub{
  font-weight:600; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);
}
.ctl{
  font-family:var(--font-display); font-size:14px; font-weight:700; letter-spacing:.03em;
  background:transparent; color:var(--ink);
  border:1.5px solid var(--line); border-radius:999px;
  padding:9px 15px; cursor:pointer; line-height:1; min-height:36px;
}
.ctl:hover{ border-color:var(--civica-mark); color:var(--civica-mark); }
.ctl[aria-pressed="true"][data-lang]{ background:var(--civica-mark); border-color:var(--civica-mark); color:var(--on-mark); }
.ctl-theme{ display:flex; align-items:center; gap:7px; padding-left:12px; }
.ctl-theme svg{ width:15px; height:15px; flex-shrink:0; }
.control-group{ display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
.lang-group{ display:flex; gap:.3rem; }

/* ---------- page ---------- */
.page{ max-width:800px; margin:0 auto; padding:2rem 1.5rem 5rem; }

header.hero{ margin-bottom:2.75rem; }
.eyebrow{
  font-weight:900; font-size:13px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--hub); margin:0 0 1rem; display:flex; align-items:center; gap:.65rem;
}
.eyebrow::after{
  content:""; flex:1; height:1.5px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--acc) 55%, transparent), transparent);
}
h1{
  font-weight:900; font-size:clamp(2rem, 4.8vw, 2.9rem); line-height:1.08; letter-spacing:-.02em;
  margin:0 0 1.1rem; text-wrap:balance;
}
.lede{ font-size:19px; color:var(--ink-2); max-width:640px; margin:0; }
h2{ font-weight:700; font-size:1.4rem; letter-spacing:-.01em; margin:0 0 1rem; color:var(--ink); line-height:1.3; }
section{ margin-bottom:3rem; }
p{ margin:0 0 1rem; max-width:68ch; }

.cite{ font-weight:600; font-size:.85em; color:var(--ink-3); white-space:nowrap; }

.micro-heading{
  font-weight:900; font-size:14px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-3); margin:1.4rem 0 .7rem;
}
.skills{ display:flex; flex-wrap:wrap; gap:.55rem; margin:0; padding:0; list-style:none; }
.skill{
  font-weight:700; font-size:14px;
  padding:.4rem .85rem; border-radius:999px; background:var(--acc-tint); color:var(--acc);
}

/* ---------- persona self-check ---------- */
.personas{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:.85rem; margin-top:1.6rem;
}
.persona{
  text-align:left; font-family:var(--font-display); background:var(--surface); color:var(--ink);
  border:1.5px solid var(--line); border-radius:var(--radius);
  padding:.9rem 1rem; cursor:pointer; transition:border-color .15s ease, background .15s ease;
}
.persona:hover{ border-color:var(--acc); }
.persona[aria-pressed="true"]{ border-color:var(--acc); box-shadow:inset 0 0 0 1px var(--acc); }
.persona-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.persona-icon{ width:28px; height:28px; flex-shrink:0; margin-bottom:.6rem; color:var(--ink-3); transition:color .15s ease; }
.persona[aria-pressed="true"] .persona-icon{ color:var(--acc); }
/* Selection is shown by shape as well as colour: a tick appears on the chosen card. */
.persona-tick{ width:20px; height:20px; flex-shrink:0; color:var(--acc); visibility:hidden; }
.persona[aria-pressed="true"] .persona-tick{ visibility:visible; }
.persona-name{ display:block; font-weight:700; font-size:16px; color:var(--ink); margin-bottom:.3rem; line-height:1.3; }
.persona-desc{ display:block; font-size:15px; color:var(--ink-2); line-height:1.45; }
.persona-note{
  margin-top:1.2rem; padding:.2rem 0 .2rem 1.1rem; border-left:3px solid var(--acc);
  font-size:16.5px; color:var(--ink-2); max-width:68ch;
}

/* ---------- concern cards ---------- */
.concerns{ display:grid; grid-template-columns:1fr; gap:.85rem; margin-top:1.4rem; }
@media (min-width:640px){ .concerns{ grid-template-columns:repeat(2,1fr); } }
.concern-card{
  border:1px solid var(--line); border-left:4px solid var(--concern); border-radius:var(--radius);
  background:var(--surface); padding:1rem 1.2rem;
}
.concern-card h3{ font-size:17px; font-weight:700; margin:0 0 .4rem; color:var(--concern); }
.concern-card p{ margin:0; font-size:16px; color:var(--ink-2); }


/* ---------- feeds/bypasses sorter ---------- */
.sorter{ margin-top:1.4rem; }
.sort-q{ font-weight:700; color:var(--ink); }
.sort-list{ list-style:none; margin:0; padding:0; display:grid; gap:.7rem; }
.sort-item{ border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:.9rem 1.1rem; }
.sort-text{ display:block; color:var(--ink); margin-bottom:.6rem; }
.sort-opts{ display:flex; flex-wrap:wrap; gap:.5rem; }
.sort-opt, .sort-btn{
  font-family:var(--font-display); font-size:15px; font-weight:700; line-height:1.2;
  background:var(--surface); color:var(--ink); border:1.5px solid var(--line);
  border-radius:999px; padding:.5rem .95rem; min-height:36px; cursor:pointer;
}
.sort-opt:hover, .sort-btn:hover{ border-color:var(--ink-3); }
.sort-opt svg{ width:15px; height:15px; margin-right:.35rem; vertical-align:-2px; }
/* Colour is never the only signal: a tick or cross sits in the button and
   the word Right / Wrong appears underneath. */
.sort-item.is-right .sort-opt[aria-pressed="true"]{ background:var(--right-tint); color:var(--right); border-color:var(--right); }
.sort-item.is-wrong .sort-opt[aria-pressed="true"]{ background:var(--wrong-tint); color:var(--wrong); border-color:var(--wrong); }
.sort-item.is-right, .sort-item.is-wrong{ border-left-width:4px; }
.sort-item.is-right{ border-left-color:var(--right); }
.sort-item.is-wrong{ border-left-color:var(--wrong); }
.sort-opt[aria-disabled="true"]{ cursor:default; color:var(--ink-2); }
.sort-opt[aria-disabled="true"]:hover{ border-color:var(--line); }
.sort-fb{ margin:.7rem 0 0; font-size:16px; color:var(--ink-2); }
.is-right .sort-fb strong{ color:var(--right); }
.is-wrong .sort-fb strong{ color:var(--wrong); }
.sort-actions{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-top:1rem; }
.sort-score{ font-weight:700; color:var(--ink); }

/* ---------- takeaways ---------- */
.takeaways{ list-style:none; margin:0; padding:0; display:grid; gap:1.05rem; }
.takeaways > li{ position:relative; padding-left:1.15rem; max-width:68ch; }
.takeaways > li::before{
  content:""; position:absolute; left:0; top:.65em; width:6px; height:6px; border-radius:50%; background:var(--acc);
}
.takeaways strong{ color:var(--ink); }

.rules-heading-row{ display:flex; align-items:center; gap:.6rem; margin-bottom:1rem; }
.rules-heading-row svg{ width:26px; height:26px; color:var(--hub); flex-shrink:0; }
.rules-heading-row h2{ margin:0; }

/* ---------- footer + CIVICA attribution ---------- */
footer{
  margin-top:3rem; border-top:1px solid var(--line-2); padding-top:1.6rem;
  color:var(--ink-3); font-size:15px; line-height:1.7;
}
footer > p{ max-width:64ch; }
.attribution{
  margin-top:1.5rem; padding-top:1.2rem;
  border-top:1.5px solid var(--civica-rule);
  display:grid; gap:.45rem; font-size:14px; max-width:64ch; color:var(--ink);
}
.attr-value{ flex:1 1 18rem; min-width:0; }
.attr-line{ display:flex; flex-wrap:wrap; align-items:baseline; gap:.2rem .55rem; margin:0; }
.attr-label{
  font-weight:900; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--civica-mark); flex:0 0 7.5rem;
}
.attribution a{ color:var(--ink); text-decoration-color:var(--civica-rule); }
.attr-role{ color:var(--ink-3); font-size:13px; }
.attr-funding{ margin:.5rem 0 0; font-size:13px; color:var(--ink-3); }

@media (max-width:600px){
  .attr-label{ flex:1 0 100%; }
  .civica-sub{ display:none; }
  .page{ padding:1.5rem 1.1rem 4rem; }
}
@media print{

  body{ background:#fff; color:#000; }
  .persona, .concern-card, .sort-item{ break-inside:avoid; }
  .sort-actions{ display:none !important; }
}

<script>
/* ===== Publication date =========================================
   Confirmed by the author. Keep in sync with data-lo-published and
   the JSON-LD datePublished in <head>.
   ================================================================ */
const PUBLISHED = "2026-08-24";

const esc  = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* Restricted markup: **bold** only. Escaped first. */
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const $ = id => document.getElementById(id);

/* ===== Shared, untranslated content =============================
   In-text citations and bibliographic references stay in their
   original form in every language. *italic* marks titles.
   ================================================================ */
const CITES = { c1:"(Baron, 2021)", c2:"(Kosmyna et al., 2025)" };
const ital = s => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>");
const REFS = {
  thorpe:  "Thorpe, J. (2024). *AI for Students: Creative Hacks for Academic Success* (1st ed.). Bloomsbury.",
  kosmyna: "Kosmyna, N., Hauptmann, E., Yuan, Y. T., Situ, J., Liao, X.-H., Beresnitzky, A. V., Braunstein, I., & Maes, P. (2025). Your brain on ChatGPT: Accumulation of cognitive debt when using an AI assistant for essay writing task (Version 2). *arXiv*.",
  baron:   "Baron, N. S. (2021). Know what? How digital technologies undermine learning and remembering. *Journal of Pragmatics, 175*, 27–37."
};
/* Text with {c1}/{c2} citation slots → escaped HTML with styled citations. */
const withCites = s => esc(s).replace(/\{(c\d)\}/g, (_, k) => `<span class="cite">${esc(CITES[k])}</span>`);

/* Decorative persona icons (aria-hidden), in the order of the persona packs. */

/* ===== Feeds / bypasses sorter ==================================
   Items are the author's two lists. Order is shuffled once per page
   load (Fisher–Yates) and stays stable across language switches.
   Feedback is immediate: the chosen button turns green (right) or red
   (wrong), with a tick or cross and the words Right / Wrong, so colour
   is never the only signal. One answer per example; "Start again"
   clears everything. The score appears once all eight are answered.
   ================================================================ */
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k]);
const SORT_N = 8;
const sortOrder = [...Array(SORT_N).keys()];
for (let i = sortOrder.length - 1; i > 0; i--){
  const j = Math.floor(Math.random() * (i + 1));
  [sortOrder[i], sortOrder[j]] = [sortOrder[j], sortOrder[i]];
}
const sortAnswer = k => k < 4 ? "f" : "b";      /* 0–3 = feeds, 4–7 = bypasses */
const sortText = (T, k) => k < 4 ? T.feeds[k] : T.bypass[k - 4];
const sortPick = {};
const ICON_OK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const ICON_NO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const sortScore = () => sortOrder.filter(k => sortPick[k] === sortAnswer(k)).length;
const sortFeedback = (T, k) => sortPick[k] === sortAnswer(k)
  ? T.sortRight
  : `${T.sortWrong} ${sortAnswer(k) === "f" ? T.sortIsFeeds : T.sortIsBypass}`;

function renderSorter(T, focusKey){
  setText("t-sort-q", T.sortQ);
  setText("sort-reset", T.sortReset);
  $("sort-list").innerHTML = sortOrder.map(k => {
    const p = sortPick[k], done = p !== undefined;
    const ok = done && p === sortAnswer(k);
    const cls = done ? (ok ? " is-right" : " is-wrong") : "";
    const btn = (v, label, extra) => {
      const chosen = p === v;
      const icon = chosen ? (ok ? ICON_OK : ICON_NO) : "";
      const dis = done && !chosen ? ' aria-disabled="true"' : "";
      return `<button type="button" class="sort-opt ${extra}" data-k="${k}" data-v="${v}" aria-pressed="${chosen}"${dis}${done ? ` aria-describedby="sort-fb-${k}"` : ""}>${icon}${esc(label)}</button>`;
    };
    let fb = "";
    if (done){
      fb = ok
        ? `<p class="sort-fb" id="sort-fb-${k}"><strong>${esc(T.sortRight)}</strong></p>`
        : `<p class="sort-fb" id="sort-fb-${k}"><strong>${esc(T.sortWrong)}</strong> ${esc(sortAnswer(k) === "f" ? T.sortIsFeeds : T.sortIsBypass)}</p>`;
    }
    return `<li class="sort-item${cls}" role="group" aria-labelledby="sort-t-${k}">
      <span class="sort-text" id="sort-t-${k}">${esc(sortText(T, k))}</span>
      <span class="sort-opts">${btn("f", T.feedsH, "feeds")}${btn("b", T.bypassH, "bypasses")}</span>${fb}</li>`;
  }).join("");
  $("sort-list").querySelectorAll(".sort-opt").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k;
    if (sortPick[k] !== undefined) return;          /* one answer per example */
    sortPick[k] = b.dataset.v;
    renderSorter(L(), k + b.dataset.v);
    const all = Object.keys(sortPick).length === SORT_N;
    announce(all
      ? `${sortFeedback(L(), k)} ${fill(L().sortScore, { n: sortScore(), total: SORT_N })}`
      : sortFeedback(L(), k));
  }));
  $("sort-score").textContent = Object.keys(sortPick).length === SORT_N
    ? fill(T.sortScore, { n: sortScore(), total: SORT_N }) : "";
  if (focusKey){
    const el = $("sort-list").querySelector(`.sort-opt[data-k="${focusKey[0]}"][data-v="${focusKey[1]}"]`);
    if (el) el.focus();
  }
}

$("sort-reset").addEventListener("click", () => {
  for (const k in sortPick) delete sortPick[k];
  renderSorter(L());
  announce("");
  const first = $("sort-list").querySelector(".sort-opt");
  if (first) first.focus();
});
const L = () => LANGS[lang];
const announce = msg => { const el = $("live"); if (el) el.textContent = msg; };

const LICENCE_URL = "https://creativecommons.org/licenses/by-nc-sa/4.0/";
const LICENCE_NAME = "Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0)";

function setText(id, s){ $(id).textContent = s; }
function listInto(id, items, html){
  $(id).innerHTML = items.map(s => `<li${id==="skills" ? ' class="skill"' : ""}>${html ? rich(s) : esc(s)}</li>`).join("");
}

function renderPersonas(T){
  const box = $("personas");
  box.innerHTML = T.personas.map((p, i) => `
    <button type="button" class="persona" data-i="${i}" aria-pressed="${i === selectedPersona}">
      <span class="persona-top">
        <svg class="persona-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">${ICONS[i]}</svg>
        ${TICK}
      </span>
      <span class="persona-name">${esc(p.name)}</span>
      <span class="persona-desc">${esc(p.desc)}</span>
    </button>`).join("");
  box.querySelectorAll(".persona").forEach(btn => btn.addEventListener("click", () => {
    selectedPersona = Number(btn.dataset.i);
    box.querySelectorAll(".persona").forEach(b =>
      b.setAttribute("aria-pressed", String(b === btn)));
    $("persona-note").textContent = L().personas[selectedPersona].note;
  }));
  $("persona-note").textContent = selectedPersona >= 0 ? T.personas[selectedPersona].note : T.personaPrompt;
}

function applyLanguage(code){
  lang = code;
  const T = LANGS[code];
  document.documentElement.lang = code;
  document.title = T.docTitle;

  setText("t-skip", T.skip);
  $("t-mark").setAttribute("aria-label", T.markLabel);
  setText("t-mark-sub", T.markSub);
  $("lang-group").setAttribute("aria-label", T.langGroup);

  setText("t-eyebrow", T.eyebrow);
  setText("t-title", T.title);
  setText("t-lede", T.lede);

  setText("stakes-heading", T.stakesH);
  $("t-stakes-p1").innerHTML = withCites(T.stakesP1);
  setText("t-stakes-p2", T.stakesP2);
  setText("t-skills-h", T.skillsH);
  listInto("skills", T.skills);

  setText("persona-heading", T.personaH);
  setText("t-persona-intro", T.personaIntro);
  renderPersonas(T);

  setText("concerns-heading", T.concernsH);
  $("concerns").innerHTML = T.concerns.map(([h, p]) =>
    `<div class="concern-card"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");

  setText("why-heading", T.whyH);
  setText("t-why-intro", T.whyIntro);
  renderSorter(T);

  setText("thoughtful-heading", T.thoughtfulH);
  setText("t-thoughtful-intro", T.thoughtfulIntro);
  listInto("takeaways", T.takeaways, true);

  setText("rules-heading", T.rulesH);
  setText("t-rules-p1", T.rulesP1);
  setText("t-rules-p2", T.rulesP2);

  $("t-adapted").innerHTML = esc(T.adapted).replace("{thorpe}", ital(REFS.thorpe));
  $("t-ref-kosmyna").innerHTML = ital(REFS.kosmyna);
  $("t-ref-baron").innerHTML = ital(REFS.baron);

  setText("t-lbl-author", T.lblAuthor);
  setText("t-lbl-published", T.lblPublished);
  setText("t-lbl-part", T.lblPart);
  setText("t-lbl-licence", T.lblLicence);
  setText("t-newtab-1", T.newTab);
  const link = `<a href="${LICENCE_URL}" target="_blank" rel="noopener noreferrer license">${esc(LICENCE_NAME)}<span class="sr-only">${esc(T.newTab)}</span></a>`;
  $("t-licence").innerHTML = esc(T.licence).replace("{link}", link);
  setText("t-funding", T.funding);

  if (PUBLISHED){
    const el = $("published-date");
    el.setAttribute("datetime", PUBLISHED);
    el.textContent = new Intl.DateTimeFormat(code === "en" ? "en-GB" : code, {
      day:"numeric", month:"long", year:"numeric", timeZone:"UTC"
    }).format(new Date(PUBLISHED + "T12:00:00Z"));
    $("published-line").hidden = false;
  }

  document.querySelectorAll("[data-lang]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === code)));

  updateThemeButton();
}

/* ---- theme ---- */
const SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v2.4M12 19.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>`;
const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/></svg>`;

function updateThemeButton(){
  const dark = document.documentElement.dataset.theme === "dark";
  $("theme-icon").innerHTML = dark ? SUN : MOON;
  $("theme-label").textContent = dark ? L().themeToLight : L().themeToDark;
  $("theme-btn").setAttribute("aria-pressed", String(dark));
  $("theme-btn").setAttribute("aria-label", dark ? L().themeToLightLabel : L().themeToDarkLabel);
}

$("theme-btn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  updateThemeButton();
});

document.querySelectorAll("[data-lang]").forEach(b =>
  b.addEventListener("click", () => applyLanguage(b.dataset.lang)));

/* Feature-detect: matchMedia is undefined in some embedded contexts. */
if (typeof window.matchMedia === "function" &&
    window.matchMedia("(prefers-color-scheme: dark)").matches){
  document.documentElement.dataset.theme = "dark";
}

applyLanguage("en");
</script>

</body>
</html>
